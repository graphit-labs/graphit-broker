[package]
name = "broker-presence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
graphit-auth = { workspace = true }
broker-control = { path = "../broker-control" }
broker-security = { path = "../broker-security" }
broker-storage = { path = "../broker-storage" }
graphit-ai = { workspace = true }
graphit-http = { workspace = true }
graphit-core = { workspace = true, features = ["async-cancel"] }
s3s = { version = "=0.17.0", default-features = false }
broker-now-wire = { path = "../broker-now-wire" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
headers = "=0.4.2"
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "serde"] }
sha2 = "=0.11.0"
form_urlencoded = "=1.2.2"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tokio = { version = "=1.53.2", default-features = false, features = ["time", "sync", "macros", "rt"] }

futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false }

[dev-dependencies]
graphit-fs = { workspace = true }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
openidconnect = { version = "=4.1.0", default-features = false }
oauth2 = { version = "=5.0.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "json", "cookies"] }
url = "=2.5.8"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
totp-rs = { version = "=6.0.0", default-features = false, features = ["alloc", "otpauth", "zeroize"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
aws-sigv4 = { version = "=1.6.0", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "=1.3.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
base64 = "=0.22.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
http-body-util = "=0.1.5"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["json", "_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "process"] }
rcgen = "=0.14.10"
tempfile = "=3.27.0"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
