<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Graphit Broker</title><style>
:root{color-scheme:light;--ink:#202D45;--muted:#5B6983;--line:#D5DEEE;--action:#3155D9;--paper:#fff;--ground:#F3F6FC;--navy:#142449}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 'Public Sans',system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:12px}.brand-glyph{width:34px;height:34px;flex:none}.brand-name{font-size:24px;font-weight:700;letter-spacing:-1px}.brand-product{border-left:1px solid #59709a;padding-left:16px;color:#c6d3ee}main{max-width:650px;margin:0 auto;padding:48px 24px}h1{font-size:clamp(28px,5vw,32px);line-height:1.2;letter-spacing:-.6px;margin:0 0 24px}p{margin:0 0 16px}.destination{color:var(--muted);overflow-wrap:anywhere}form{margin-top:32px}button{font:inherit;font-weight:600;color:var(--paper);background:var(--action);border:1px solid var(--action);border-radius:6px;min-height:44px;padding:10px 24px;cursor:pointer}button:hover{background:#2847ba}button:focus-visible{outline:3px solid var(--action);outline-offset:4px}.help{margin-top:24px;color:var(--muted)}@media(max-width:400px){main{padding:32px 20px}.brand-name{font-size:22px}.brand-product{font-size:14px;padding-left:12px}}

label{display:block;font-weight:600;margin:24px 0 8px}input:not([type=hidden]){width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;padding:10px 12px}input:focus-visible,a:focus-visible{outline:3px solid var(--action);outline-offset:4px}a{color:var(--action);overflow-wrap:anywhere}form button{margin-top:24px}.providers{display:flex;flex-direction:column;gap:16px;margin:24px 0}.provider{display:block;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:12px 16px;text-decoration:none;min-height:44px}.error{border-left:4px solid #B43A35;padding:12px 16px;background:var(--paper);margin:24px 0}.hint{font-size:14px;color:var(--muted);margin-top:8px}code{font:15px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.codes{padding:16px 0;list-style:none}.codes li{margin:8px 0}.qr{display:block;width:220px;max-width:100%;height:auto;margin:16px 0}.continue{display:inline-block;min-height:44px;padding:10px 0}.captcha{margin-top:24px;max-width:100%;overflow:auto}
</style></head><body data-ui="graphit-auth"><header><svg class="brand-glyph" aria-hidden="true" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#3155d9"/><g fill="none" stroke="white" stroke-width="2.8" stroke-linecap="square"><path d="M22 12 11 15v23l11-3M26 13l11-3v23l-11 3"/></g></svg><span class="brand-name">Graphit</span><span class="brand-product">Broker</span></header><main><h1>{{ title }}</h1>{% if origin %}<p class="destination">Application: {{ origin }}</p>{% endif %}
