[package]
name = "broker-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }
totp-rs = { version = "=6.0.0", default-features = false, features = ["alloc", "otpauth", "qr", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom", "zeroize"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
