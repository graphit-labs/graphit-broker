[package]
name = "broker-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
graphit-fs = { workspace = true }
broker-now-wire = { path = "../broker-now-wire", version = "=0.1.0" }
oxide-auth = { version = "=0.6.1", default-features = false }
openidconnect = { version = "=4.1.0", default-features = false }
oauth2 = { version = "=5.0.0", default-features = false }
serde_json_path = "=0.7.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
url = "=2.5.8"
iri-string = "=0.7.14"
percent-encoding = "=2.3.2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
base64 = "=0.22.1"
getrandom = { version = "=0.4.3", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
broker-store = { path = "../broker-store" }
broker-security = { path = "../broker-security" }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["json", "_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["json"] }
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "sync"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ulid = { version = "=3.0.0", default-features = false }
globset = "=0.4.20"
regex = "=1.13.1"
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
http-body-util = "=0.1.5"
totp-rs = { version = "=6.0.0", default-features = false, features = ["alloc", "otpauth", "zeroize"] }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "process"] }
rcgen = "=0.14.10"
tempfile = "=3.27.0"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
