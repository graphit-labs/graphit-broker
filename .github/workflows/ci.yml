name: Native CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  admin-ui:
    name: Administration UI syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-admin-ui.cjs

  rust:
    name: Rust and local tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Set up Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          packages=()
          if ! command -v cc >/dev/null || ! command -v c++ >/dev/null || ! command -v make >/dev/null; then
            packages+=(build-essential)
          fi
          # Keep at least the CMake version supplied by Ubuntu 24.04's package.
          if ! cmake --version >/dev/null 2>&1; then
            packages+=(cmake)
          else
            version=$(cmake --version | sed -n '1s/^cmake version //p')
            if ! dpkg --compare-versions "$version" ge 3.28.3; then packages+=(cmake); fi
          fi
          # Bindgen's clang-sys runtime accepts Ubuntu's versioned libclang C ABI;
          # it does not require the libclang development headers or linker symlink.
          clang_packages=("libclang1-18:$(dpkg --print-architecture)" libclang-common-18-dev)
          for package in "${clang_packages[@]}"; do
            if ! dpkg-query -W -f='${db:Status-Status}\n' "$package" 2>/dev/null | grep -Fx installed >/dev/null; then
              packages+=(libclang-dev)
              break
            fi
          done
          for package in libssl-dev pkg-config; do
            if ! dpkg-query -W -f='${db:Status-Status}\n' "$package" 2>/dev/null | grep -Fx installed >/dev/null; then packages+=("$package"); fi
          done
          if ((${#packages[@]})); then
            printf 'Installing native build packages: %s\n' "${packages[*]}"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          for tool in cc c++ make cmake pkg-config; do
            command -v "$tool" || { printf 'Missing native build tool: %s\n' "$tool" >&2; exit 1; }
          done
          version=$(cmake --version | sed -n '1s/^cmake version //p')
          dpkg --compare-versions "$version" ge 3.28.3 || { printf 'CMake >= 3.28.3 required, found %s\n' "$version" >&2; exit 1; }
          pkg-config --print-errors --exists openssl
          for package in "${clang_packages[@]}"; do
            dpkg-query -W -f='${db:Status-Status}\n' "$package" | grep -Fx installed >/dev/null || { printf 'Missing installed native package: %s\n' "$package" >&2; exit 1; }
          done
          dpkg-query -W -f='${binary:Package} ${Version}\n' "${clang_packages[@]}"
      - name: Set up Darwin native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkgconf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Set up Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Identify compiled cache ABI
        id: build-context
        shell: bash
        run: |
          host=$(rustc +1.98.0 -vV | sed -n 's/^host: //p')
          test -n "$host"
          identity=$(mktemp "$RUNNER_TEMP/graphit-abi.XXXXXX")
          trap 'rm -f "$identity"' EXIT
          {
            rustc +1.98.0 -vV
            printf '%s\n' "${RUNNER_OS:?}" "${RUNNER_ARCH:?}" "${ImageOS:?}" "${ImageVersion:?}"
            env | LC_ALL=C sort | sed -n -E '/^(CC|CXX|CFLAGS|CPPFLAGS|CXXFLAGS|LDFLAGS|RUSTFLAGS|RUSTDOCFLAGS|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|CARGO_ENCODED_RUSTFLAGS|CARGO_BUILD_TARGET|CARGO_INCREMENTAL|CARGO_PROFILE_.*|CMAKE_.*|GGML_.*|LLAMA_.*|LBUG_.*|CUDA.*|CUDNN.*|OPENSSL_.*|PKG_CONFIG.*|LIBCLANG_PATH)=/p'
            cmake --version
            case "$RUNNER_OS" in
              Linux)
                cc --version
                c++ --version
                dpkg-query -W gcc g++ libc6-dev libssl-dev pkg-config 'libclang*'
                ;;
              macOS)
                clang --version
                xcrun --show-sdk-version
                brew list --versions cmake pkgconf llvm
                ;;
              Windows)
                printf '%s\n' "${VCToolsVersion:?}" "${WindowsSDKVersion:?}" "${UCRTVersion:?}" "${VSCMD_ARG_TGT_ARCH:?}"
                # CL prints /Bv version information but can return 2 without input files.
                MSYS_NO_PATHCONV=1 cl /Bv 2>&1 || test "$?" -eq 2
                "$LIBCLANG_PATH/clang.exe" --version
                ;;
            esac
          } > "$identity"
          abi=$(git hash-object --stdin < "$identity")
          printf 'host=%s\nabi=%s\n' "$host" "$abi" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo dependencies
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: broker-cargo-v2-${{ runner.os }}-${{ runner.arch }}-1.98-${{ hashFiles('Cargo.lock') }}
      - name: Restore compiled Rust and native dependencies
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.d
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.dll
            target/debug/deps/*.lib
            target/debug/graphit-broker*
            target/debug/xtask*
            target/${{ steps.build-context.outputs.host }}/debug/.fingerprint
            target/${{ steps.build-context.outputs.host }}/debug/build
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.rlib
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.rmeta
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.d
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.so
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.dylib
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.dll
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.lib
            target/${{ steps.build-context.outputs.host }}/debug/xtask*
          key: broker-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.host }}-${{ steps.build-context.outputs.abi }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            broker-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.host }}-${{ steps.build-context.outputs.abi }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'xtask/Cargo.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}-
      - name: Fetch locked dependencies
        run: cargo +1.98.0 fetch --locked
      - name: Save prepared Cargo dependencies
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Prepare offline Rust checks without running tests
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.0"
        run: |
          cargo build --locked --offline --target host-tuple -p xtask
          cargo clippy --locked --offline --workspace --all-targets --keep-going -- -D warnings
          cargo test --locked --offline --workspace --all-targets --no-run
      - name: Save compiled Rust and native dependencies before tests
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.d
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.dll
            target/debug/deps/*.lib
            target/debug/graphit-broker*
            target/debug/xtask*
            target/${{ steps.build-context.outputs.host }}/debug/.fingerprint
            target/${{ steps.build-context.outputs.host }}/debug/build
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.rlib
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.rmeta
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.d
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.so
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.dylib
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.dll
            target/${{ steps.build-context.outputs.host }}/debug/deps/*.lib
            target/${{ steps.build-context.outputs.host }}/debug/xtask*
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Run ordinary Rust checks
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.0"
        run: cargo run --locked --offline --target host-tuple -p xtask -- hook pre-push
