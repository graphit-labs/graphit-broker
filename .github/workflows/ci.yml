name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet, and build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint
      - name: Test and vet
        run: make check
      - name: Cache verified ONNX Runtime archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit-broker/native
          key: broker-onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native-deps.env') }}
      - name: Build and smoke-test self-contained broker binary
        run: |
          make build VERSION="ci-${{ github.sha }}"
          runtime_root=$(mktemp -d)
          GRAPHIT_GLOBAL_DIR="$runtime_root" ./graphit-broker --version
          test -s "$runtime_root/runtime/onnxruntime/1.29.0/linux-amd64"/*/libonnxruntime.so.1.29.0
          test -s "$runtime_root/runtime/onnxruntime/1.29.0/linux-amd64"/*/libonnxruntime_providers_shared.so
          test -s "$runtime_root/runtime/onnxruntime/1.29.0/linux-amd64"/*/libonnxruntime_providers_cuda.so

  container:
    name: Build container
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: graphit-broker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
