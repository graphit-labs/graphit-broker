name: Native CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  admin-ui:
    name: Administration UI syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-admin-ui.cjs

  rust:
    name: Rust and local tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Set up Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libclang-dev libssl-dev pkg-config
      - name: Set up Darwin native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkgconf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Set up Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: broker-ci-1.98-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo +1.98.0 fetch --locked
      - name: Run ordinary Rust checks
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.0"
        run: cargo run --locked --offline --target host-tuple -p xtask -- hook pre-push
