database:
  # sqlite (default), postgres, or mysql. This config chooses the environment variable name;
  # an empty BROKER_DATABASE_DSN uses the YAML-owned fallback after portable ~ expansion.
  driver: "sqlite"
  dsn: "${BROKER_DATABASE_DSN:-~/.graphit/broker/broker.db}"
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3m

server:
  address: ":8080"
  # Browser origins allowed to call the OAuth/OIDC endpoints. Empty emits no CORS headers at all.
  # Only a browser-based MCP client needs this; server-side agent runtimes are unaffected.
  cors:
    allowed_origins: []
  # HTTP is allowed only on localhost/loopback; also set administration.cookie_secure: false.
  public_url: "https://broker.example.com"
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_request_bytes: 4194304

authentication:
  # One deployment pepper protects local password preprocessing, browser sessions/upstream flows,
  # OIDC subject/signing/encryption domains, local tokens, and service credentials with distinct domains.
  # It is never stored in SQL.
  token_pepper: "${BROKER_AUTH_TOKEN_PEPPER:?set at least 32 random bytes from a secret manager}"
  # SQL-backed human login is enabled by default when administration is enabled. Set false for
  # an upstream-OIDC-only broker, or set true explicitly when Broker OIDC login is needed without administration.
  local:
    login:
      enabled: true
    # Failed local-password checks are limited per username. At most max_concurrent expensive
    # Argon2id checks run at once per broker process. Up to max_concurrent * saturation_multiplier
    # calls (running plus waiting) are admitted; calls beyond that return HTTP 429 with Retry-After.
    # Successful and saturation-rejected checks do not consume the failure quota.
    rate_limit:
      max_failures: 5
      window: 1m
      lockout: 5m
      max_concurrent: 2
      saturation_multiplier: 4
    # Optional adaptive bot protection for the first local-password step. Select `turnstile`
    # (Cloudflare managed widget) or `recaptcha` (Google reCAPTCHA v2 Checkbox). The attempt that
    # raises per-process admission to max(1, ceil(max_concurrent * trigger_multiplier)) must pass
    # the provider before Argon2id. Use 0 to require CAPTCHA from the first attempt, or a positive
    # fraction to start before max_concurrent. Provider failures fail closed only while required.
    # server.public_url is mandatory when enabled and its hostname is checked on every proof.
    captcha:
      enabled: false
      provider: "turnstile" # or "recaptcha"
      site_key: "${BROKER_LOCAL_CAPTCHA_SITE_KEY}"
      secret_key: "${BROKER_LOCAL_CAPTCHA_SECRET_KEY}"
      trigger_multiplier: 1.5
      verification_timeout: 3s
    # Human local users must enroll a Google Authenticator-compatible TOTP factor by default.
    # Enrollment and verification challenges are short-lived and bound to the login flow.
    mfa:
      required: true
      issuer: "Graphit Broker"
      challenge_ttl: 10m
    # Local human passwords are accepted only by browser/device login. The Broker acts as the
    # OpenID Provider and issues signed ID/access JWTs plus opaque rotating refresh credentials. Desktop callbacks use the
    # configured path on an explicit 127.0.0.1 or ::1 ephemeral port.
    tokens:
      audience: "graphit-broker"
      cli_client_id: "graphit-cli"
      cli_redirect_path: "/oauth/callback"
      access_ttl: 10m
      refresh_ttl: 720h
      authorization_code_ttl: 1m
      device_code_ttl: 10m
      device_poll_interval: 5s
      service_credential_max_ttl: 8760h
      # RFC 7591 client registration at POST /oauth/register, advertised as registration_endpoint.
      # Off unless set: enabling it lets anyone who can reach the broker create a client, which is
      # the deliberate trade for letting a hosted MCP agent connect without manual provisioning.
      # Only public clients are ever created; confidential metadata is rejected.
      dynamic_registration: false
      # Canonical URIs of the Graphit MCP endpoints this deployment serves. Validates the RFC 8707
      # resource indicator and is published in /.well-known/graphit-broker so each Graphit daemon
      # learns which resource it is. Each grant accepts one listed absolute URI without a fragment;
      # a token request may omit it or repeat that exact grant value. Empty accepts no indicator.
      mcp_resources: []
  oidc:
    # Defaults to true; false disables this upstream issuer for bearer and browser login.
    # Required environment references are still checked even when disabled.
    - enabled: true
      # Shown as this provider's button label on Broker and administration login screens.
      display_name: "Corporate SSO"
      issuer: "https://identity.example.com"
      audiences: ["graphit-broker"]
      # Optional and empty by default. The broker asks this issuer for no scope of its own; list
      # one here only if your own authorization policy wants it, using a scope your IdP already
      # mints. A token's reach is decided by its audience.
      required_scopes: []
      # This issuer validates consumer bearers and supplies the optional upstream browser method
      # used by both Broker-managed Graphit Code login and administration login.
      client_id: "graphit-broker"
      client_secret: "${BROKER_OIDC_CLIENT_SECRET:?set the confidential client secret}"
      redirect_url: "https://broker.example.com/oauth/oidc/callback"
      scopes: ["openid", "profile", "email"]
      subject_claim: "sub"
      name_claim: "name"
      email_claim: "email"
      username_claim: "preferred_username"
      organization_claim: "$.organization.id"
      teams_claim: "$.groups[*].name"
      # Additional token roles are authoritative when configured; every authenticated principal
      # still receives the built-in default role user.
      role_claim: "$.realm_access.roles[*]"

# Local users are stored in SQL and managed from /admin/. On a new database, create the first
# local administrator with `graphit-broker --config config.yaml --bootstrap-admin` (or the explicit
# stdin variant for automation). The command accepts only a password and creates username admin.

# Configuration is deployment-owned and changes require a restart. The administration API exposes
# a redacted read-only view. Resource grants, roles, assignments, flows, and sessions remain in SQL.
administration:
  enabled: true
  session_ttl: 8h
  # Disable only for an explicit local HTTP development deployment.
  cookie_secure: true
  # Public/native Graphit CLI client used only to render exact provider/login snippets in the UI.
  cli:
    provider_name: "organization-broker"
    profile_name: "organization-broker"

# Resource grants are not accepted in YAML. A new database starts deny-by-default. Sign in at
# /admin/, then create grants in Resource grants or through /admin/api/v1/grants.

services:
  embeddings:
    enabled: true
    # HTTP providers: OpenAI-compatible, Cohere, Voyage, or Google.
    # For local execution replace upstream with protocol: onnx, model: coderankembed (CPU by default).
    # Set device: auto to try GPU with CPU fallback, or device: cuda to require NVIDIA GPU.
    # Omit dimensions to infer the ONNX width, or set 768 for coderankembed.
    # See examples/local-models.yaml; ONNX upstreams do not accept HTTP options.
    # Embedding compatibility revision published to Graphit.
    # HTTP: change when the model or vector generation changes, then rebuild embeddings.
    # ONNX: optional readable prefix; the resolved model identity is appended automatically.
    revision: "embedding-route-2026-09-07.1"
    dimensions: 1536
    max_batch: 256
    max_input_bytes: 1048576
    upstream:
      protocol: "openai-embeddings-v1"
      url: "https://api.openai.com/v1/embeddings"
      model: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY:?set the broker-owned OpenAI API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      send_dimensions: false
      timeout: 45s
    cache:
      ttl: 10m
      max_entries: 10000

  rerank:
    enabled: true
    # Native upstream rerank: Cohere, Voyage, Jina, or Graphit-compatible.
    # For local execution use protocol: onnx and model: bge-reranker-base in upstream.
    # Embedding-simulated rerank: OpenAI/OpenAI-compatible or Google Gemini.
    # HTTP: change when the rerank model or scoring behavior changes.
    # ONNX: optional readable prefix; the resolved model identity is appended automatically.
    revision: "rerank-route-2026-09-07.1"
    max_documents: 1000
    max_document_bytes: 1048576
    upstream:
      protocol: "cohere-v2"
      url: "https://api.cohere.com/v2/rerank"
      model: "rerank-v4.0-fast"
      api_key: "${COHERE_API_KEY:?set the broker-owned Cohere API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      timeout: 45s
      # For simulated rerank, set url/model to the provider's embedding endpoint/model instead.
    cache:
      ttl: 5m
      max_entries: 10000

  s3:
    enabled: true
    default_route: "primary"
    routes:
      primary:
        region: "us-east-1"
        endpoint: ""
        bucket: "graphit-artifacts"
        base_prefix: "graphit"
        access_key_id: "${PRIMARY_S3_ACCESS_KEY_ID:?set the primary S3 access key}"
        secret_access_key: "${PRIMARY_S3_SECRET_ACCESS_KEY:?set the primary S3 secret key}"
        # AWS: the assumable IAM role. MinIO: any placeholder ARN mints for the signing user.
        sts_role_arn: "arn:aws:iam::123456789012:role/graphit-broker"
        sts_endpoint: "" # Defaults to endpoint for S3-compatible storage; empty uses AWS STS.
        sts_session_name: "graphit-broker"
        sts_duration: 1h
      public:
        # Each named route owns its complete topology and direct signing credential.
        region: "us-east-1"
        endpoint: "https://minio.example.com"
        bucket: "graphit-public"
        base_prefix: "catalog"
        access_key_id: "${PUBLIC_S3_ACCESS_KEY_ID:?set the public S3 access key}"
        secret_access_key: "${PUBLIC_S3_SECRET_ACCESS_KEY:?set the public S3 secret key}"
        sts_role_arn: "arn:aws:iam::123456789012:role/graphit-public"
        sts_endpoint: "https://minio.example.com"
        sts_session_name: "graphit-broker"
        sts_duration: 1h
