server:
  address: ":8080"
  public_url: "https://broker.example.com"
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_request_bytes: 4194304

authentication:
  oidc:
    - issuer: "https://identity.example.com"
      audiences: ["graphit-broker"]
      required_scopes: ["graphit.use"]
      username_claim: "preferred_username"
      organization_claim: "organization.id"
      teams_claim: "groups"
  # API keys are useful for trusted local/service profiles. Prefer token_sha256.
  # api_keys:
  #   - name: "local-automation"
  #     token_sha256: "<64-character SHA-256 of the local broker token>"
  #     subject: "local-automation"
  #     username: "automation"
  #     organization: "local"
  #     teams: ["automation"]

# The management UI uses a separate credential namespace. Its token can never authorize an AI
# or S3 request. The state file contains ACL policy, not credentials, and is written atomically.
administration:
  enabled: true
  state_file: "/var/lib/graphit-auth-broker/access-policy.json"
  api_keys:
    - name: "platform-admin"
      token_sha256: "${BROKER_ADMIN_TOKEN_SHA256:?set the SHA-256 of the administration token}"

authorization:
  rules:
    - name: "organization AI"
      access: "organization"
      principal: "acme"
      capabilities: ["embeddings", "rerank"]
    - name: "platform project storage"
      access: "team"
      principal: "platform"
      capabilities: ["s3"]
      projects: ["platform-*"]
      s3_operations: ["read", "write", "publish"]
      s3_route: "primary"
      # Prefixes are logical; bucket/base_prefix are applied only after authorization.
      s3_prefixes: ["v2/projects/{project}"]
    # Graphit asks for project "global" when reading the Hub control plane. Grant only the
    # logical prefixes that this principal must discover; the physical route stays private.
    - name: "platform Hub control plane"
      access: "team"
      principal: "platform"
      capabilities: ["s3"]
      projects: ["global"]
      s3_operations: ["read"]
      s3_route: "primary"
      s3_prefixes: ["v2/registry", "v2/global", "v2/authenticated", "v2/teams/platform"]
    # Anonymous access is opt-in and should normally be read-only.
    # - name: "public catalog"
    #   access: "anonymous"
    #   capabilities: ["s3"]
    #   projects: ["public-catalog"]
    #   s3_operations: ["read"]
    #   s3_route: "public"
    #   s3_prefixes: ["v2/projects/public-catalog"]
    # - name: "local automation"
    #   subjects: ["local-automation"]
    #   capabilities: ["embeddings", "rerank"]

services:
  embeddings:
    enabled: true
    route: "graphit-default"
    # Change this value whenever the effective vector space changes.
    revision: "embedding-route-2026-09-07.1"
    dimensions: 1536
    max_batch: 256
    max_input_bytes: 1048576
    upstream:
      protocol: "openai-embeddings-v1"
      url: "https://api.openai.com/v1/embeddings"
      model: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY:?set the broker-owned OpenAI API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      send_dimensions: false
      timeout: 45s
    cache:
      ttl: 10m
      max_entries: 10000

  rerank:
    enabled: true
    route: "graphit-default"
    revision: "rerank-route-2026-09-07.1"
    max_documents: 1000
    max_document_bytes: 1048576
    upstream:
      protocol: "cohere-v2"
      url: "https://api.cohere.com/v2/rerank"
      model: "rerank-v4.0-fast"
      api_key: "${COHERE_API_KEY:?set the broker-owned Cohere API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      timeout: 45s
    cache:
      ttl: 5m
      max_entries: 10000

  s3:
    enabled: true
    default_route: "primary"
    presign_expiry: 5m
    max_presign_expiry: 15m
    authorization_revision: "acl-2026-09-07.1"
    routes:
      primary:
        region: "us-east-1"
        endpoint: ""
        bucket: "graphit-artifacts"
        base_prefix: "graphit"
        access_key_id: "${PRIMARY_S3_ACCESS_KEY_ID:?set the primary S3 access key}"
        secret_access_key: "${PRIMARY_S3_SECRET_ACCESS_KEY:?set the primary S3 secret key}"
      public:
        # Each named route owns its complete topology and direct signing credential.
        region: "us-east-1"
        endpoint: "https://minio.example.com"
        bucket: "graphit-public"
        base_prefix: "catalog"
        access_key_id: "${PUBLIC_S3_ACCESS_KEY_ID:?set the public S3 access key}"
        secret_access_key: "${PUBLIC_S3_SECRET_ACCESS_KEY:?set the public S3 secret key}"
