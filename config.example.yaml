database:
  # sqlite (default), postgres, or mysql. The DSN and driver are deployment-owned.
  driver: "sqlite"
  dsn: "/var/lib/graphit-broker/broker.db"
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3m

server:
  address: ":8080"
  public_url: "https://broker.example.com"
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_request_bytes: 4194304

authentication:
  # One deployment pepper protects local password preprocessing, browser sessions, OIDC state,
  # local OAuth grants/tokens, and service credentials with distinct cryptographic domains.
  # It is never stored in SQL.
  token_pepper: "${BROKER_AUTH_TOKEN_PEPPER:?set at least 32 random bytes from a secret manager}"
  # SQL-backed human login is enabled by default when administration is enabled. Set false for
  # an OIDC-only broker, or set true explicitly when OAuth login is needed without administration.
  local_login:
    enabled: true
  # Failed local-password checks are limited per username. At most max_concurrent expensive
  # Argon2id checks run at once per broker process. Up to max_concurrent * saturation_multiplier
  # calls (running plus waiting) are admitted; calls beyond that return HTTP 429 with Retry-After.
  # Successful and saturation-rejected checks do not consume the failure quota.
  local_rate_limit:
    max_failures: 5
    window: 1m
    lockout: 5m
    max_concurrent: 2
    saturation_multiplier: 4
  # Human local users must enroll a Google Authenticator-compatible TOTP factor by default.
  # Enrollment and verification challenges are short-lived and bound to the login flow.
  local_mfa:
    required: true
    issuer: "Graphit Broker"
    challenge_ttl: 10m
  # Local human passwords are accepted only by browser/device login. The broker then issues
  # opaque, HMAC-protected credentials with the lifetimes below. Desktop callbacks must use the
  # configured path on an explicit 127.0.0.1 or ::1 ephemeral port.
  local_tokens:
    audience: "graphit-broker"
    cli_client_id: "graphit-cli"
    cli_redirect_path: "/oauth/callback"
    access_ttl: 10m
    refresh_ttl: 720h
    authorization_code_ttl: 1m
    device_code_ttl: 10m
    device_poll_interval: 5s
    service_credential_max_ttl: 8760h
  oidc:
    - issuer: "https://identity.example.com"
      audiences: ["graphit-broker"]
      required_scopes: ["graphit.use"]
      # The same issuer and claim mapping authenticate broker consumers, Graphit Code, and administrators.
      client_id: "${BROKER_OIDC_CLIENT_ID:?set the confidential browser client ID}"
      client_secret: "${BROKER_OIDC_CLIENT_SECRET:?set the confidential client secret}"
      redirect_url: "${BROKER_OIDC_REDIRECT_URL:?set the exact /oauth/oidc/callback URL}"
      scopes: ["openid", "profile", "email"]
      subject_claim: "sub"
      name_claim: "name"
      email_claim: "email"
      username_claim: "preferred_username"
      organization_claim: "$.organization.id"
      teams_claim: "$.groups[*].name"
      # Additional token roles are authoritative when configured; every authenticated principal
      # still receives the built-in default role user.
      role_claim: "$.realm_access.roles[*]"

# Local users are stored in SQL and managed from /admin/. On a new database, create the first
# local administrator with `graphit-broker --config config.yaml --bootstrap-admin` (or the explicit
# stdin variant for automation). The command accepts only a password and creates username admin.

# Configuration is deployment-owned and changes require a restart. The administration API exposes
# a redacted read-only view. Resource grants, roles, assignments, flows, and sessions remain in SQL.
administration:
  enabled: true
  session_ttl: 8h
  # Disable only for an explicit local HTTP development deployment.
  cookie_secure: true
  # Public/native Graphit CLI client used only to render exact provider/login snippets in the UI.
  cli:
    provider_name: "organization-broker"
    profile_name: "organization-broker"

# Resource grants are not accepted in YAML. A new database starts deny-by-default. Sign in at
# /admin/, then create grants in Resource grants or through /admin/api/v1/grants.

# Global ONNX model catalog. Each selected ID resolves as <directory>/<id>/manifest.json.
# The two preset manifests are materialized automatically and fetch their pinned artifacts only
# when their corresponding local service is enabled. Custom IDs require a manifest in the volume.
models:
  directory: "/var/cache/graphit-broker/models"
  embedding: "coderankembed"
  rerank: "bge-reranker-base"
  generate: "" # schema reservation; local generation is not served yet

services:
  embeddings:
    enabled: true
    # upstream: OpenAI-compatible, Cohere, Voyage, or Google; local: CodeRankEmbed ONNX.
    backend: "upstream"
    route: "graphit-default"
    # For local models this is an optional readable prefix; the catalog identity is appended.
    revision: "embedding-route-2026-09-07.1"
    dimensions: 1536
    max_batch: 256
    max_input_bytes: 1048576
    upstream:
      protocol: "openai-embeddings-v1"
      url: "https://api.openai.com/v1/embeddings"
      model: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY:?set the broker-owned OpenAI API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      send_dimensions: false
      timeout: 45s
    # Used only when backend is local. Model paths and inference semantics live in its manifest.
    local:
      device: "auto" # macOS: CoreML -> CPU; Linux/Windows: visible CUDA -> CPU
      device_id: 0
    cache:
      ttl: 10m
      max_entries: 10000

  rerank:
    enabled: true
    # Native upstream rerank: Cohere, Voyage, Jina, or Graphit-compatible.
    # Embedding-simulated rerank: OpenAI/OpenAI-compatible or Google Gemini.
    backend: "upstream"
    route: "graphit-default"
    revision: "rerank-route-2026-09-07.1"
    max_documents: 1000
    max_document_bytes: 1048576
    upstream:
      protocol: "cohere-v2"
      url: "https://api.cohere.com/v2/rerank"
      model: "rerank-v4.0-fast"
      api_key: "${COHERE_API_KEY:?set the broker-owned Cohere API key}"
      api_key_header: "Authorization"
      api_key_scheme: "Bearer"
      timeout: 45s
      # For simulated rerank, set url/model to the provider's embedding endpoint/model instead.
    # Used only when backend is local. The selected catalog manifest owns model semantics.
    local:
      device: "auto" # macOS: CoreML -> CPU; Linux/Windows: visible CUDA -> CPU
      device_id: 0
    cache:
      ttl: 5m
      max_entries: 10000

  s3:
    enabled: true
    default_route: "primary"
    presign_expiry: 5m
    max_presign_expiry: 15m
    routes:
      primary:
        region: "us-east-1"
        endpoint: ""
        bucket: "graphit-artifacts"
        base_prefix: "graphit"
        access_key_id: "${PRIMARY_S3_ACCESS_KEY_ID:?set the primary S3 access key}"
        secret_access_key: "${PRIMARY_S3_SECRET_ACCESS_KEY:?set the primary S3 secret key}"
      public:
        # Each named route owns its complete topology and direct signing credential.
        region: "us-east-1"
        endpoint: "https://minio.example.com"
        bucket: "graphit-public"
        base_prefix: "catalog"
        access_key_id: "${PUBLIC_S3_ACCESS_KEY_ID:?set the public S3 access key}"
        secret_access_key: "${PUBLIC_S3_SECRET_ACCESS_KEY:?set the public S3 secret key}"
