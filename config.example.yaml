# Native Rust schema. Values below are operator choices, not implicit defaults.
# Supply PostgreSQL CA, signing PKCS8 key and deployment secrets before use.
# See docs/configuration.md and docs/rust-broker-server.md.
server:
  address: 127.0.0.1:8080
  public_url: https://broker.example.test
  # Optional writable path for overrides edited in the administration console.
  # instruction_overrides_file: agent-instructions.json
database:
  backend: postgres
  host: postgres.example.test
  port: 5432
  database: graphit
  username: graphit_owner
  password: "${BROKER_DATABASE_PASSWORD:?required}"
  ca_file: postgres-ca.pem
  text_bytes: 256
  ca_bytes: 8192
  pool:
    max_connections: 2
    min_connections: 0
    statement_cache_capacity: 0
    connect_timeout: 8s
    acquire_timeout: 5s
    operation_timeout: 8s
    startup_timeout: 15s
    shutdown_timeout: 2s
    max_lifetime: 60s
    idle_timeout: 30s
    statement_timeout: 10s
    lock_timeout: 10s
    idle_transaction_timeout: 15s
  flows:
    provider_bytes: 128
    request_bytes: 128
    continuation_bytes: 512
auth:
  issuer: https://broker.example.test
  audience: storage-api
  kid: configured-key
  resource: https://broker.example.test/v1
  pkcs8_file: signing.pk8
  key_bytes: 8192
  pepper: "${BROKER_PEPPER:?required}"
  digest:
    pepper_bytes: 256
    token_bytes: 8192
    binding_bytes: 256
    subject_bytes: 256
    recovery_bytes: 256
storage:
  enabled: true
  required_scopes: []
  request_timeout: 10s
  sts_timeout: 5s
  identity_json_bytes: 8192
  grants_json_bytes: 65536
  head_bytes: 16384
  token_bytes: 8192
  metadata_bytes: 65536
  routes:
    native-fs:
      driver: filesystem
      bucket: native-storage
      base_prefix: graphit
      directory: volumes/native-storage
