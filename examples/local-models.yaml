database:
  driver: sqlite
  dsn: /var/lib/graphit-broker/local-models.db
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3m

server:
  address: ":8080"

authentication:
  api_keys:
    - username: local-example
      password_hash: "${BROKER_EXAMPLE_PASSWORD_HASH:?generate with graphit-broker --hash-password --password-pepper-env BROKER_EXAMPLE_PASSWORD_PEPPER}"
      pepper: "${BROKER_EXAMPLE_PASSWORD_PEPPER:?set at least 32 bytes}"
      subject: local-example

models:
  directory: /var/cache/graphit-broker/models
  embedding: coderankembed
  rerank: bge-reranker-base
  generate: ""

services:
  embeddings:
    enabled: true
    backend: local
    route: graphit-default
    revision: coderankembed
    dimensions: 768
    max_batch: 256
    max_input_bytes: 1048576
    local:
      device: auto
      device_id: 0
    cache:
      ttl: 10m
      max_entries: 10000

  rerank:
    enabled: true
    backend: local
    route: graphit-default
    revision: bge-reranker-base
    max_documents: 1000
    max_document_bytes: 1048576
    local:
      device: auto
      device_id: 0
    cache:
      ttl: 5m
      max_entries: 10000

  s3:
    enabled: false
