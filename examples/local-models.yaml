database:
  driver: sqlite
  dsn: /var/lib/graphit-broker/local-models.db
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3m

server:
  address: ":8080"

authentication:
  token_pepper: "${BROKER_AUTH_TOKEN_PEPPER:?set at least 32 random bytes before bootstrapping local users}"

services:
  embeddings:
    enabled: true
    revision: coderankembed
    dimensions: 768
    max_batch: 256
    max_input_bytes: 1048576
    upstream:
      protocol: onnx
      model: coderankembed
      directory: /var/cache/graphit-broker/models
      device: auto
      device_id: 0
    cache:
      ttl: 10m
      max_entries: 10000

  rerank:
    enabled: true
    revision: bge-reranker-base
    max_documents: 1000
    max_document_bytes: 1048576
    upstream:
      protocol: onnx
      model: bge-reranker-base
      directory: /var/cache/graphit-broker/models
      device: auto
      device_id: 0
    cache:
      ttl: 5m
      max_entries: 10000

  s3:
    enabled: false
