database:
  driver: sqlite
  dsn: /var/lib/graphit-broker/graphit-broker-smoke.db
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3m

server:
  address: ":8080"

authentication:
  api_keys:
    - username: "smoke-test"
      password_hash: "${BROKER_EXAMPLE_PASSWORD_HASH:?generate with graphit-broker --hash-password --password-pepper-env BROKER_EXAMPLE_PASSWORD_PEPPER}"
      pepper: "${BROKER_EXAMPLE_PASSWORD_PEPPER:?set at least 32 bytes}"
      subject: "smoke-test"

services:
  embeddings:
    enabled: false
  rerank:
    enabled: false
  s3:
    enabled: false
