[workspace]
members = ["crates/broker-store", "crates/broker-security", "crates/broker-control", "crates/broker-presence", "crates/broker-now-wire", "crates/broker-storage", "crates/broker-server", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
graphit-ai = { git = "https://github.com/graphit-labs/graphit-code.git", rev = "abfb7eec0a45170585f2a1c3c2852d6d03582d7b", version = "=0.1.0" }
graphit-auth = { git = "https://github.com/graphit-labs/graphit-code.git", rev = "abfb7eec0a45170585f2a1c3c2852d6d03582d7b", version = "=0.1.0" }
graphit-core = { git = "https://github.com/graphit-labs/graphit-code.git", rev = "abfb7eec0a45170585f2a1c3c2852d6d03582d7b", version = "=0.1.0" }
graphit-fs = { git = "https://github.com/graphit-labs/graphit-code.git", rev = "abfb7eec0a45170585f2a1c3c2852d6d03582d7b", version = "=0.1.0" }
graphit-http = { git = "https://github.com/graphit-labs/graphit-code.git", rev = "abfb7eec0a45170585f2a1c3c2852d6d03582d7b", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0

[profile.test]
debug = 0
strip = "debuginfo"

# Keep the production password parameters in integration tests without debug KDF overhead.
[profile.test.package.argon2]
opt-level = 2
