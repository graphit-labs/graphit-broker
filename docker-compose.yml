services:
  broker:
    build: .
    image: graphit-broker:local
    restart: unless-stopped
    env_file: ".env"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/etc/graphit-broker/config.yaml:ro
      - broker-state:/var/lib/graphit-broker
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  broker-state:
