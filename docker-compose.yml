services:
  broker:
    build: .
    image: graphit-broker:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    # CPU by default. Use the NVIDIA runtime on GPU hosts as documented below.
    runtime: ${GRAPHIT_BROKER_CONTAINER_RUNTIME:-runc}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - broker-config:/etc/graphit-broker
      - broker-state:/var/lib/graphit-broker
      - broker-models:/var/cache/graphit-broker/models
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  broker-config:
  broker-state:
  broker-models:
