services:
  broker:
    image: ${GRAPHIT_BROKER_IMAGE:-ghcr.io/graphit-labs/graphit-broker:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    # CPU by default. Use the NVIDIA runtime on GPU hosts as documented below.
    runtime: ${GRAPHIT_BROKER_CONTAINER_RUNTIME:-runc}
    environment:
      GRAPHIT_GLOBAL_DIR: ${GRAPHIT_GLOBAL_DIR:-/home/graphit/.graphit}
      GRAPHIT_BROKER_CONFIG: ${GRAPHIT_BROKER_CONFIG:-/home/graphit/.graphit/broker/config.yaml}
      GRAPHIT_BROKER_HEALTHCHECK_URL: ${GRAPHIT_BROKER_HEALTHCHECK_URL:-http://127.0.0.1:8080/readyz}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - broker-global:/home/graphit/.graphit/broker
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  broker-global:
